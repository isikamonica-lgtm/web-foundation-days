<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>User Directory</title>

    <script src="users.js" defer></script>
  </head>

  <body>
    <h1>User Directory</h1>

    <button id="load-users" type="button">
      Load Users
    </button>

    <label for="filter-input">Filter users by name:</label>

    <input
      id="filter-input"
      type="text"
      placeholder="Enter a user's name"
    />

    <p id="status">Click the button to load users.</p>

    <ul id="users-list"></ul>
  </body>
</html>
