<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes Draft</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <section>
            <h1>QuickNotes</h1>
            <p>Write your notes and track your progress.</p>

            <label for="note-text">Write your note</label>

            <textarea id="note-text" rows="10" cols="50"></textarea>

            <p id="char-count">0 / 200 characters</p>
            <p id="word-count">0 words</p>

            <button id="clear-btn" type="button">Clear</button>
            <button id="theme-toggle" type="button">Dark mode</button>
        </section>
    </main>
</body>
</html>
